
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            margin: 0;
            padding: 40px 20px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn { 
            display: block;
            width: 100%;
            padding: 15px 0; 
            font-size: 18px; 
            font-weight: bold;
            margin: 12px 0; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
        }
        .btn-play { background: #28a745; color: white; }
        .btn-shop { background: #007bff; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="welcome-title">Welcome to The Game!</h1>
        <h3 id="user-info">Country: CM | Currency: FCFA</h3>
    </div>

    <div style="max-width: 400px; margin: 0 auto;">
        <button id="btn-play" class="btn btn-play" onclick="alert('Game Started!')">Play</button>
        <button id="btn-shop" class="btn btn-shop" onclick="alert('Shop Opened!')">Buy 100 Coins (3,000 FCFA)</button>
    </div>

    <script>
        // Detection simple sans dependance externe
        async function initGame() {
            let country = "CM";
            let currency = "FCFA";
            let price = "3,000 FCFA";

            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    const data = await res.json();
                    country = data.country_code || "CM";
                    if (country === "FR" || country === "DE") {
                        currency = "EUR";
                        price = "4.99 €";
                    } else if (country === "US") {
                        currency = "USD";
                        price = "$4.99";
                    }
                }
            } catch (e) {
                console.log("IP API non disponible, utilisation des valeurs par defaut.");
            }

            document.getElementById('user-info').innerText = "Country: " + country + " | Currency: " + currency;
            document.getElementById('btn-shop').innerText = "Buy 100 Coins (" + price + ")";
        }

        window.onload = initGame;
    </script>
</body>
</html>
